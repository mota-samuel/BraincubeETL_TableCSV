# Frequências centralizadas (Modelo B). A ordem dentro de cada job é a ordem de execução.
retry_cooldown_minutes: 30

jobs:
  - name: fechamento_dia
    schedule: "daily 05:00"
    queries:
      - oee_dia_mb15
      - disponibilidade_dia_mb15
      - qualidade_dia_mb15
      - performance_dia_mb15
      - fechamento_dia_mb15

  - name: tempos
    schedule: "daily 05:15"
    queries:
      - time_running_dia_mb15
      - tempo_calendario_mb15
      - time_running_mensal_mb15

  - name: gdd_semanal
    schedule: "weekly mon 06:00"
    queries:
      - time_running_semanal_mb15

  - name: monitoramento_rapido
    schedule: "every 5 minutes"
    queries:
        - paradas_mb14
        - perdas_mb16

notify:
  notify_on: failure          # e-mail imediato só em falha
  mail_smtp: "smtp.office365.com:587"
  mail_user: samuel_mota@br.ajinomoto.com
  mail_from: samuel_mota@br.ajinomoto.com
  mail_to: [samuel_mota@br.ajinomoto.com]
  digest_time: "01:25"
  # teams_webhook: https://...
