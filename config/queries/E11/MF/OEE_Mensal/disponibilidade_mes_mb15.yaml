name: disponibilidade_mes_mb15
enabled: true

data_source: mb15

order:
  mode: fixed
  value: mb15/d1500001

window:
  mode: fixed
  lookback_years: 2

definitions:
  source: file
  path: config/inputs/E11/MF/OEE_Mensal/grupo_variables_Disponibility.csv
  column: UUID

filter:
  AND:
    - NOTNULL: ["mb15/d1500113"]
    - BETWEEN: ["mb15/d1500002", "{window.start}", "{window.end}"]

rename:
  enabled: true
  priority: [standard, local, tag]

rules:
  - type: melt
    separator: " - "
    attribute_name: Atributo
    value_name: "Disponibilidade - Mensal"
  - type: parse_attribute
    source: Atributo
    separator: " - "
    machine: Maquina
    line: Linha
  - type: fillna
    columns: ["Disponibilidade - Mensal"]
    value: 0

output:
  file: disponibilidade_dia_mb15.csv
  delimiter: ";"
  decimal: ","
  encoding: utf-8-sig
  datetime_format: "%d/%m/%Y %H:%M:%S"
  date_only_columns: []
  na_rep: ""
  allow_missing_columns: false
  sort:
    - column: Timestamp
      ascending: true
  columns:
    - Timestamp
    - Linha
    - Maquina
    - "Disponibilidade - Mensal"