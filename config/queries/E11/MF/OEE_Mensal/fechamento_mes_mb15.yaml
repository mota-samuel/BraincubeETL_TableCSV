name: fechamento_mes_mb15
enabled: true

compose:
  keys: [Timestamp, Linha, Maquina]
  base:
    query: oee_mes_mb15
    column: "OEE - Mensal"
  joins:
    - query: disponibilidade_mes_mb15
      column: "Disponibilidade - Mensal"
      rename: Disponibilidade
    - query: qualidade_mes_mb15
      column: "Qualidade - Mensal"
      rename: Qualidade
    - query: performance_mes_mb15
      column: "Performance - Mensal"
      rename: Performance

output:
  file: fechamento_mes_mb15.csv
  delimiter: ";"
  decimal: ","
  encoding: utf-8-sig
  datetime_format: "%d/%m/%Y %H:%M:%S"
  date_only_columns: []
  na_rep: ""
  allow_missing_columns: false
  sort:
    - column: Timestamp
      ascending: false
  columns:
    - Timestamp
    - Linha
    - Maquina
    - "OEE - Mensal"
    - Disponibilidade
    - Qualidade
    - Performance