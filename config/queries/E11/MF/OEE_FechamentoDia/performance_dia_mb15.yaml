name: performance_dia_mb15
enabled: true

data_source: mb15

order:
  mode: fixed
  value: mb15/d1500001

window:
  mode: fixed
  lookback_years: 2

definitions:
  source: file
  path: config/inputs/E11/MF/OEE_FechamentoDia/grupo_variables_Performance.csv
  column: UUID

filter:
  AND:
    - NOTNULL: ["mb15/d1500045"]
    - BETWEEN: ["mb15/d1500002", "{window.start}", "{window.end}"]

rename:
  enabled: true
  priority: [standard, local, tag]

rules:
  - type: melt
    separator: " - "
    attribute_name: Atributo
    value_name: "Performance - Dia Ajinomoto"
  - type: parse_attribute
    source: Atributo
    separator: " - "
    machine: Maquina
    line: Linha
  - type: fillna
    columns: ["Performance - Dia Ajinomoto"]
    value: 0

output:
  file: performance_dia_mb15.csv
  delimiter: ";"
  decimal: ","
  encoding: utf-8-sig
  datetime_format: "%d/%m/%Y %H:%M:%S"
  date_only_columns: []
  na_rep: ""
  allow_missing_columns: false
  sort:
    - column: Timestamp
      ascending: true
  columns:
    - Timestamp
    - Linha
    - Maquina
    - "Performance - Dia Ajinomoto"